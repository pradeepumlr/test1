---
- name: Deploy Maven Application
  hosts: webserver
  become: yes
  tasks:
    - name: Copy JAR file to remote server
      copy:
        src: target/my-app.jar
        dest: /home/ubuntu/my-app.jar
        mode: 0755

    - name: Start application
      command: nohup java -jar /home/ubuntu/my-app.jar &
